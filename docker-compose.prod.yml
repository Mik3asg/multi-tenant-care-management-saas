services:
  postgres:
    image: postgres:16-alpine
    container_name: care-postgres
    environment:
      POSTGRES_DB: care
      POSTGRES_USER: care
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - care-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U care -d care"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: care-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - care-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: care-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/care
      SPRING_DATASOURCE_USERNAME: care
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET}
      AUTH0_ISSUER_URI: ${AUTH0_ISSUER_URI}
      AUTH0_MGMT_CLIENT_ID: ${AUTH0_MGMT_CLIENT_ID}
      AUTH0_MGMT_CLIENT_SECRET: ${AUTH0_MGMT_CLIENT_SECRET}
      # Redirect to the frontend nginx container after login/logout
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: care-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  care-pgdata:
  care-redisdata:
