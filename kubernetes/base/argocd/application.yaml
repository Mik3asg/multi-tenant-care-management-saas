# Registered once, manually, after ArgoCD is confirmed Running:
#   kubectl apply -f kubernetes/base/argocd/application.yaml
#
# Not part of any kustomization — this bootstraps ArgoCD to watch the repo;
# from here on ArgoCD pulls kubernetes/overlays/production on its own sync
# loop. CI (Phase 6) only bot-commits image tag changes into that overlay —
# it never runs `kubectl apply` directly (docs/infra-plan.md GitOps decision).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: care-management-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Mik3asg/multi-tenant-care-management-saas.git
    targetRevision: main
    path: kubernetes/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
  # ESO's admission webhook back-fills defaults on fields this manifest
  # leaves unset (spec.target.creationPolicy/deletionPolicy, and
  # conversionStrategy/decodingStrategy/metadataPolicy on every data[].remoteRef
  # entry), plus writes status fields (refreshTime, sync conditions) after
  # every sync. Confirmed via `kubectl get externalsecret ... -o yaml` — none
  # of this is real drift, just ESO's own defaulting, but ArgoCD's diff
  # doesn't know that without being told explicitly.
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - '.status'
        - '.spec.target.creationPolicy'
        - '.spec.target.deletionPolicy'
        - '.spec.data[].remoteRef.conversionStrategy'
        - '.spec.data[].remoteRef.decodingStrategy'
        - '.spec.data[].remoteRef.metadataPolicy'
