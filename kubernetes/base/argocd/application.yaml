# Registered once, manually, after ArgoCD is confirmed Running:
#   kubectl apply -f kubernetes/base/argocd/application.yaml
#
# Not part of any kustomization — this bootstraps ArgoCD to watch the repo;
# from here on ArgoCD pulls kubernetes/overlays/production on its own sync
# loop. CI (Phase 6) only bot-commits image tag changes into that overlay —
# it never runs `kubectl apply` directly (docs/infra-plan.md GitOps decision).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: care-management-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Mik3asg/multi-tenant-care-management-saas.git
    targetRevision: main
    path: kubernetes/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
  # ESO writes status fields (refreshTime, sync conditions) back onto the
  # ExternalSecret object after every sync — without this, ArgoCD sees that
  # as permanent drift from the git-committed spec and loops re-syncing a
  # resource that's actually fine (Health already reports "Secret was synced").
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /status
