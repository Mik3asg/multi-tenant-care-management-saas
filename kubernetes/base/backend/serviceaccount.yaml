# Name/namespace must exactly match the IRSA trust policy in
# infrastructure/terraform/modules/irsa (system:serviceaccount:production:backend)
# — irsa_backend module block in environments/production/main.tf.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: production
  annotations:
    # Account-specific — matches `terraform output irsa_backend_role_arn`.
    eks.amazonaws.com/role-arn: arn:aws:iam::207137402976:role/carecloudly-production-backend
