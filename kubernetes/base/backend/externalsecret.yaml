# No secret.yaml — this replaces it entirely. Pulls the DB password (from the
# Terraform-managed shadow secret — see main.tf's db_credentials comment) and
# the Auth0 credentials (seeded manually, see docs/infra-plan.md Phase 5) from
# Secrets Manager into a runtime k8s Secret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secrets
  namespace: production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: backend-secrets
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: care-db-credentials
        property: password
    - secretKey: AUTH0_CLIENT_ID
      remoteRef:
        key: auth0-credentials
        property: client-id
    - secretKey: AUTH0_CLIENT_SECRET
      remoteRef:
        key: auth0-credentials
        property: client-secret
    - secretKey: AUTH0_ISSUER_URI
      remoteRef:
        key: auth0-credentials
        property: issuer-uri
    - secretKey: AUTH0_MGMT_CLIENT_ID
      remoteRef:
        key: auth0-credentials
        property: mgmt-client-id
    - secretKey: AUTH0_MGMT_CLIENT_SECRET
      remoteRef:
        key: auth0-credentials
        property: mgmt-client-secret
