name: PR checks

on:
  pull_request:
    paths:
      - "infrastructure/terraform/**"

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Action version moves — confirm this is still current before relying on it.
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/terraform
          quiet: true
          soft_fail: false
